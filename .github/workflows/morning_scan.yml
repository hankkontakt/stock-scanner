name: 🌅 Morgonkoll (Vardag 09:35 CET)

on:
  schedule:
    # 08:35 UTC = 09:35 CET (vinter) / 10:35 CEST (sommar)
    # Stockholmsbörsen öppnar 09:00 – vi kör 35 min in för att
    # öppningsgapen ska ha satt sig och vi fortfarande hinner agera
    - cron: "35 8 * * 1-5"

  workflow_dispatch:
    inputs:
      force_email:
        description: "Skicka email även utan alerts (test)"
        type: boolean
        default: false

jobs:
  morning-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Morgonkoll ska aldrig ta mer än 10 min

    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installera beroenden
        run: pip install -r requirements.txt

      # Återställ data – behöver senaste scored_universe_*.csv
      - name: 📂 Återställ data
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/history
            data/paper_trades.json
            data/scan_log.json
          key: scanner-data-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            scanner-data-${{ runner.os }}-

      # VIKTIGT: reports/-mappen måste finnas (innehåller scored_universe_*.csv)
      # Den committas av veckoscannen – se till att den senaste koden är med
      - name: 📁 Skapa mappar
        run: mkdir -p data/cache data/history reports

      - name: ⭐ Ladda bevakningslista
        if: ${{ secrets.WATCHLIST_JSON != '' }}
        run: echo '${{ secrets.WATCHLIST_JSON }}' > data/watchlist.json
        continue-on-error: true

      - name: 🌅 Kör morgonkoll
        env:
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_email }}" = "true" ]; then
            python morning_scan.py --force-email
          else
            python morning_scan.py
          fi

      - name: 📤 Spara morgonrapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morning-report-${{ github.run_number }}
          path: reports/morning_*.md
          retention-days: 14

      - name: 💾 Uppdatera logg
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "MarketScan Bot"
          git add data/scan_log.json || true
          git diff --staged --quiet || git commit -m "🤖 Morgonkoll $(date +%Y-%m-%d)"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
