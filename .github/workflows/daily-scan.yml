name: Daily Portfolio Check

on:
  schedule:
    # Måndag–fredag 16:00 UTC (18:00 svensk tid, efter börsstängning)
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut kod
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Återskapa holdings
        run: echo "${{ secrets.HOLDINGS_CSV }}" > holdings.csv

      - name: Kör daglig scan
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python daily_scan.py

      - name: Ladda upp rapport
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
