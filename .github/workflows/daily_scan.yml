name: 📊 MarketScan Pipeline (Daily)

on:
  schedule:
    # Morgon: 07:05 UTC = 09:05 CEST (5 min efter Stockholmsbörsen öppnar 09:00)
    - cron: "5 7 * * 1-5"
    # Kväll: 15:30 UTC = 17:30 CEST (precis när Stockholmsbörsen stänger)
    - cron: "30 15 * * 1-5"
    # Veckoscan lördag: 07:00 UTC = 09:00 CEST
    - cron: "0 7 * * 6"
    # Retry rate-limitade (lördag): 11:00 UTC = 13:00 CEST (4h efter veckoscan)
    - cron: "0 11 * * 6"
    # Småbolag måndag: 07:15 UTC = 09:15 CEST
    - cron: "15 7 * * 1"
    # Retry rate-limitade (måndag): 11:00 UTC = 13:00 CEST (4h efter småbolagsscan)
    - cron: "0 11 * * 1"
    # Portfolio price refresh: 11:10 UTC = 13:10 CEST
    - cron: "10 11 * * 1-5"
    # Refresh missing data: 08:00 + 15:00 UTC = 10:00 + 17:00 CEST
    - cron: "0 8,15 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: 'Körläge'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
          - weekly
          - smallcap
          - targeted
          - refresh_missing
          - retry_rate_limited
      tickers:
        description: 'Kommaseparerade tickers (endast för targeted-läge, t.ex. VOLV-B.ST,ERIC-B.ST)'
        required: false
        default: ''

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # retry_rate_limited kan ta upp till 60 min (5 pass × ~10 min + delays)
    timeout-minutes: 60
    permissions:
      contents: write   # Krävs för git push via GITHUB_TOKEN
    env:
      PYTHONPATH: .

    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installera beroenden
        run: pip install -r requirements.txt

      - name: 📂 Återställ data-cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/history
          key: scanner-data-${{ runner.os }}
          restore-keys: |
            scanner-data-${{ runner.os }}-

      - name: 📁 Skapa mappar
        run: mkdir -p data/cache data/history reports

      - name: ✅ Verifiera holdings.csv
        run: |
          if [ -f data/holdings.csv ]; then
            echo "✓ holdings.csv finns ($(wc -l < data/holdings.csv) rader)"
          else
            echo "ℹ holdings.csv saknas – kör utan portföljdata"
          fi

      - name: ⭐ Ladda bevakningslista
        run: |
          if [ -n "$WATCHLIST_JSON" ]; then
            echo "$WATCHLIST_JSON" > data/watchlist.json
          fi
        env:
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
        continue-on-error: true

      - name: 🔄 Bestäm körläge
        id: mode
        # ⚠️  P1-FIX: Cron-strängmatchning är skör — om schema ändras måste
        # matchningen uppdateras SYNKRONT. Schemat (UTC) → mode-mappning:
        #   "5 7 * * 1-5"  → morning          (mån-fre 09:05 CEST)
        #   "30 15 * * 1-5" → evening          (mån-fre 17:30 CEST)
        #   "0 7 * * 6"    → weekly            (lör 09:00 CEST)
        #   "0 11 * * 6"   → retry_rate_limited (lör 13:00 CEST)
        #   "15 7 * * 1"   → smallcap          (mån 09:15 CEST)
        #   "0 11 * * 1"   → retry_rate_limited (mån 13:00 CEST)
        #   "10 11 * * 1-5" → portfolio_refresh (mån-fre 13:10 CEST)
        #   "0 8,15 * * 1-5" → refresh_missing (mån-fre 10:00+17:00 CEST)
        # Fallback: morning (säkert default — re-scannar med morgon-regler)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "tickers=${{ github.event.inputs.tickers }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "5 7 * * 1-5" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 15 * * 1-5" ]; then
            echo "mode=evening" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 7 * * 6" ]; then
            echo "mode=weekly" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 11 * * 6" ]; then
            echo "mode=retry_rate_limited" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 7 * * 1" ]; then
            echo "mode=smallcap" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 11 * * 1" ]; then
            echo "mode=retry_rate_limited" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "10 11 * * 1-5" ]; then
            echo "mode=portfolio_refresh" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 8,15 * * 1-5" ]; then
            echo "mode=refresh_missing" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          else
            # Okänt schema — fallback morning (logga för felsökning)
            echo "⚠️  Okänt cron-schema: '${{ github.event.schedule }}' — kör morning som fallback" >&2
            echo "mode=morning" >> $GITHUB_OUTPUT
            echo "tickers=" >> $GITHUB_OUTPUT
          fi
          # Logga valt läge för enkel CI-felsökning
          echo "✅ Valt körläge: $(grep 'mode=' $GITHUB_OUTPUT | head -1 | cut -d= -f2)"

      - name: 🚀 Kör pipeline
        env:
          EMAIL_SENDER:     ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          TARGET_TICKERS:   ${{ steps.mode.outputs.tickers }}
          # Rotation: set ROTATION_DRY_RUN=false to auto-execute rotation
          # Default "true" for safety -- rotation previews without executing
          ROTATION_DRY_RUN: ${{ secrets.ROTATION_DRY_RUN || 'true' }}
          # Retry: max antal yttre pass och fördröjning (s) per pass
          RETRY_MAX_PASSES: "5"
          RETRY_PASS_DELAY_S: "120"
        run: |
          echo "▶️ Kör pipeline i läge: ${{ steps.mode.outputs.mode }}"
          python -c "from core.daily_pipeline import run_pipeline; run_pipeline('${{ steps.mode.outputs.mode }}')"

      - name: 📤 Spara rapport som artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: reports/*.md
          retention-days: 30

      - name: 🧹 Rensa gamla rapporter (>14 dagar)
        run: |
          find reports/ -name "scored_universe_*.csv" -mtime +14 -delete 2>/dev/null || true
          find reports/ -name "scored_universe_*.parquet" -mtime +14 -delete 2>/dev/null || true
          find reports/ -name "smallcap_scored_*.csv" -mtime +14 -delete 2>/dev/null || true
          find reports/ -name "smallcap_scored_*.parquet" -mtime +14 -delete 2>/dev/null || true
          find reports/ -name "*.md" -mtime +7 -delete 2>/dev/null || true
          echo "🧹 Retention policy executed"

      - name: 💾 Committa CSV- och rapportdata
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "MarketScan Bot"
          # Stage ALLT som inte är gitignorat. Pipelinen ändrar flera spårade
          # filer (blacklist.json, strike_list.json, scores_prev m.fl.) — att
          # lista dem manuellt missade alltid någon, vilket lämnade ostagade
          # ändringar som fick "git pull --rebase" att krascha med exit 128.
          # .gitignore skyddar cache/secrets/pyc, så -A är säkert här.
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Pipeline ${{ steps.mode.outputs.mode }} $(date +%Y-%m-%d)"
          # --autostash: stasha ev. kvarvarande ändringar under rebasen som
          # extra säkerhetsnät så pull aldrig stoppas av en working tree-diff.
          # Om email_delivery_log.json får merge conflict (CI + annan commit
          # skriver samtidigt) väljer vi alltid CI:s version — den har nyast data.
          git pull --rebase --autostash -X ours origin main || {
            echo "Rebase misslyckades — försöker med --skip på email_delivery_log..."
            git checkout --ours data/email_delivery_log.json 2>/dev/null || true
            git add data/email_delivery_log.json 2>/dev/null || true
            GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip 2>/dev/null || true
          }
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚨 Skicka felmail om pipeline misslyckas
        if: failure()
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: |
          python -c "from core.email_template import send_failure_alert; send_failure_alert('daily_scan/${{ steps.mode.outputs.mode }}', '${{ github.run_id }}', '${{ github.repository }}')" || true