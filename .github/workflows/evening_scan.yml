name: 🌆 Kvällsrapport (Vardag 17:30 CET)

on:
  schedule:
    # 16:30 UTC = 17:30 CET (vinter) / 18:30 CEST (sommar)
    # Stockholmsbörsen stänger 17:30 – vi kör exakt vid stängning
    # så vi fångar slutkurserna för dagen
    - cron: "30 16 * * 1-5"

  workflow_dispatch:

jobs:
  evening-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installera beroenden
        run: pip install -r requirements.txt

      - name: 📂 Återställ data
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/history
            data/paper_trades.json
            data/scan_log.json
          key: scanner-data-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            scanner-data-${{ runner.os }}-

      - name: 📁 Skapa mappar
        run: mkdir -p data/cache data/history reports

      - name: 📋 Ladda innehav (holdings.csv)
        run: |
          if [ -n "$HOLDINGS_CSV" ]; then
            echo "$HOLDINGS_CSV" > holdings.csv
            echo "✓ holdings.csv laddad ($(wc -l < holdings.csv) rader)"
          else
            echo "ℹ HOLDINGS_CSV ej satt – kör utan portföljdata"
          fi
        env:
          HOLDINGS_CSV: ${{ secrets.HOLDINGS_CSV }}

      - name: ⭐ Ladda bevakningslista
        run: |
          if [ -n "$WATCHLIST_JSON" ]; then
            echo "$WATCHLIST_JSON" > data/watchlist.json
          fi
        env:
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
        continue-on-error: true

      - name: 🌆 Kör kvällsrapport
        env:
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python evening_scan.py

      - name: 📤 Spara kvällsrapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evening-report-${{ github.run_number }}
          path: reports/evening_*.md
          retention-days: 30

      - name: 💾 Uppdatera logg, paper trades och CSV-data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "MarketScan Bot"
          git add data/scan_log.json data/paper_trades.json reports/scored_universe_*.csv || true
          git diff --staged --quiet || git commit -m "🤖 Kvällsrapport $(date +%Y-%m-%d)"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
