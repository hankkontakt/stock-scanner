name: 🤖 AI-veckosammanfattning (Söndag 18:00 CET)

on:
  schedule:
    # 16:00 UTC = 17:00 CET (vinter) / 18:00 CEST (sommar)
    # Söndagar – efter att veckans alla scan-körningar är klara
    - cron: "0 16 * * 0"

  workflow_dispatch:
    inputs:
      force_ai:
        description: "Kör även om inget nytt data (test)"
        type: boolean
        default: false

jobs:
  ai-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installera beroenden
        run: pip install -r requirements.txt

      # Återställ veckans data för att AI-sammanfattningen ska ha något att utgå ifrån
      - name: 📂 Återställ data
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/history
            data/scan_log.json
            data/paper_trades.json
          key: scanner-data-${{ runner.os }}
          restore-keys: |
            scanner-data-${{ runner.os }}-

      - name: 📁 Skapa nödvändiga mappar
        run: mkdir -p data/cache data/history reports

      - name: 🤖 Generera AI-veckosammanfattning
        env:
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
        run: python scans/ai_weekly_summary.py

      - name: 📤 Spara AI-sammanfattning som artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-weekly-summary-${{ github.run_number }}
          path: reports/ai_weekly_summary_*.md
          retention-days: 90

      - name: 💾 Committa sammanfattning till repot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "MarketScan Bot"
          git add reports/ai_weekly_summary_*.md || true
          git diff --staged --quiet || git commit -m "🤖 AI-veckosammanfattning $(date +%Y-%m-%d)"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
