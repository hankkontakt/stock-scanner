name: 🧪 Tests

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tests/**"
      - "web/**"
      - "scans/**"
      - "smallcap/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v6

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installera ruff
        run: pip install ruff

      - name: 🔍 Ruff check
        run: ruff check core/ tests/ portfolio/ web/ smallcap/ scripts/ --output-format=github

  type-check:
    runs-on: ubuntu-latest
    # T4: continue-on-error kvar tills de ~200 befintliga mypy-felen är åtgärdade.
    # Mål: ta bort detta när core/ är mypy-clean (target: 2026-Q3).
    # Fel SYNS tydligt i CI-loggen med felräknaren nedan.
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v6

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installera mypy + dependencies
        run: |
          pip install mypy
          pip install -r requirements.txt

      - name: 🏷️ MyPy check (T4)
        run: |
          # Kör mypy och räkna fel (synligt i CI-loggen)
          mypy core/ --ignore-missing-imports 2>&1 | tee /tmp/mypy_out.txt || true
          ERROR_COUNT=$(grep -c "error:" /tmp/mypy_out.txt || echo 0)
          echo "::notice::MyPy hittade $ERROR_COUNT fel i core/ (mål: 0 — se T4 i audit)"
          tail -5 /tmp/mypy_out.txt
          # Misslyckas bara om felen ÖKAR från baseline (100+ = alltid fel)
          # TODO(T4): Sänk tröskeln progressivt: 200 → 150 → 100 → 50 → 0
          [ "$ERROR_COUNT" -lt 300 ] || (echo "MyPy-fel överstiger 300 — åtgärda!" && exit 1)

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .

    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v6

      - name: 🐍 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Installera beroenden
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-mock hypothesis

      - name: 🧪 Kör tester med täckning (parallellt)
        run: |
          pytest tests/ -v --tb=short -n auto \
            --cov=core \
            --cov-fail-under=40 \
            --cov-report=term-missing \
            --cov-report=xml \
            --durations=10 \
            -m "not slow"
          # T5: Höjt 30% → 40% (T5-FIX). xdist-parallell coverage kompenseras nu av
          # att fler tester lagts till (security, chaos, property-based tests).
          # Mål: höj progressivt till 60% när ytterligare integrationstest är klara.

      - name: 🐌 Kör prestandatester (seriellt)
        run: |
          pytest tests/test_performance.py -v --tb=short \
            --cov=core --cov-append \
            -m slow || echo "Performance tests skipped (may be slow on CI)"

      - name: 📊 Ladda upp täckningsrapport
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: 📋 Spara pytest-resultat som JSON (AI-läsbar, bara 3.11)
        if: always() && matrix.python-version == '3.11'
        run: |
          mkdir -p data/ci_reports
          python - <<'PYEOF'
          import json, subprocess, os
          from datetime import datetime, timezone
          from pathlib import Path
          # Hämta täckningsprocent från coverage.xml om det finns
          coverage_pct = None
          try:
              import xml.etree.ElementTree as ET
              tree = ET.parse("coverage.xml")
              root = tree.getroot()
              coverage_pct = round(float(root.attrib.get("line-rate", 0)) * 100, 1)
          except Exception:
              pass
          report = {
              "ts":           datetime.now(timezone.utc).isoformat(),
              "run_id":       int(os.environ.get("GITHUB_RUN_ID", 0)),
              "workflow":     "tests",
              "python":       "3.11",
              "branch":       os.environ.get("GITHUB_REF_NAME", "main"),
              "commit":       os.environ.get("GITHUB_SHA", "")[:8],
              "job_status":   os.environ.get("JOB_STATUS", "unknown"),
              "coverage_pct": coverage_pct,
              "url":          f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}",
          }
          Path("data/ci_reports/last_test_run.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(f"Pytest-rapport sparad (täckning: {coverage_pct}%)")
          PYEOF
        env:
          JOB_STATUS: ${{ job.status }}

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v6

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installera pip-audit
        run: pip install pip-audit

      - name: 🔒 Kontrollera CVE:er i beroenden
        # continue-on-error: true — audit-fel blockerar INTE CI men syns tydligt i loggen.
        # TODO(T7): sätt continue-on-error: false när kända false positives är tystate.
        continue-on-error: true
        run: pip-audit -r requirements.txt --format columns
