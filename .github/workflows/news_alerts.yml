name: 🚨 MarketScan News Alerts (Real-time)

on:
  schedule:
    # Var 30:e minut, vardagar 09:00-22:00 sommar / 08:00-21:00 vinter (07-20 UTC)
    - cron: "*/30 7-20 * * 1-5"

  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Krävs för att committa dedup-state
    env:
      PYTHONPATH: .

    steps:
      - name: 📥 Hämta kod
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installera beroenden
        run: pip install -r requirements.txt

      - name: 🚨 Kör nyhetslarm
        env:
          EMAIL_SENDER:     ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "from core.news_alerts import check_alerts; check_alerts()"

      - name: 💾 Committa dedup-state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "MarketScan Alerts Bot"
          git add data/news_alert_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 News alert state $(date +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash origin main || true
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}