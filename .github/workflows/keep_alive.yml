name: 💤 Keep Alive

on:
  schedule:
    # Var 30:e minut 06:00-23:00 UTC = 08:00-01:00 CEST (aktiva timmar)
    # Minskat från */20 * * * * (2160 min/mån) för att spara GitHub Actions-minuter.
    # Streamlit Community Cloud "always on" rekommenderas som alternativ.
    - cron: "*/30 6-22 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 🏓 Pinga Streamlit-appen
        run: |
          URL="${{ secrets.STREAMLIT_APP_URL || 'https://stock-scanner-hank.streamlit.app' }}"
          echo "Pingar $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "HTTP-status: $STATUS"
          # 200 = OK, 302 = redirect (lösenordsskyddad) — båda räknas som liv
          if [[ "$STATUS" == "200" || "$STATUS" == "302" || "$STATUS" == "301" ]]; then
            echo "✅ Appen är vaken"
          else
            echo "⚠️ Oväntat svar: $STATUS (kan vara tillfälligt)"
          fi
