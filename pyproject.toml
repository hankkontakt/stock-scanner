[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "stock-scanner"
version = "1.0.0"
description = "Multifaktor-aktiescanner med sentimentanalys och automatiserad rapportering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hank Kontakt"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "yfinance>=0.2.40,<0.3.0",
    "pandas>=2.0.0,<2.3.0",
    "numpy>=1.24.0,<2.2.0",
    "requests>=2.32.0,<3.0.0",
    "tabulate>=0.9.0,<1.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "flask>=3.0.0,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "PyNaCl>=1.5.0,<2.0.0",
    "streamlit>=1.32.0,<2.0.0",
    "plotly>=5.18.0,<6.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "xgboost>=2.0.0,<3.0.0",
    "joblib>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0",
    "types-requests",
    "types-python-dateutil",
]

[tool.ruff]
# Ruff-konfiguration – snabb Python-linter
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "F",    # Pyflakes — riktiga buggar (undefined names, unused imports etc.)
    "E",    # Pycodestyle — syntax-fel (ej stil)
    "W",    # Pycodestyle — varningar (ej stilregler)
]
ignore = [
    # ── Stil / kosmetika — för lång befintlig kodbas ──────────────────────
    "E501",   # line-too-long — hanteras av ruff-format
    "E402",   # module-import-not-at-top — vanligt i Streamlit-appar
    "E701",   # multiple-statements-on-one-line-colon
    "E702",   # multiple-statements-on-one-line-semicolon
    "E711",   # comparison-to-none (== None vs is None — intentional)
    "E712",   # comparison-to-bool
    "E722",   # bare-except — avsiktliga i pipelinen
    "E741",   # ambiguous-variable-name (l, O, I)
    # ── Pyflakes — vanliga falskt positiva ────────────────────────────────
    "F401",   # unused-import — ofta intentionella re-exports
    "F811",   # redefinition-of-unused — intentional override i tests
    "F841",   # unused-variable — vanliga i except-block
    # ── Whitespace — auto-fixbara men rör för många filer ────────────────
    "W291",   # trailing-whitespace
    "W293",   # whitespace-before-comment
    "W292",   # no-newline-at-end-of-file
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
# Mypy-konfiguration – statisk typkontroll
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: Integrationstest med mockade beroenden (körs ej i normal CI)",
    "slow: Tester som tar >30s",
]
